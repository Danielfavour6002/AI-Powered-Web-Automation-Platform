<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA Platform</title>
    <meta name="description" content="Automated QA Testing Platform — Record, replay, and report on browser test flows.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css?v=6">
    <script src="/static/js/app.js?v=6" defer></script>
    <script>
        // Blocking script: apply theme + sidebar state BEFORE paint to avoid flash
        (function() {
            var theme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            if (localStorage.getItem('sidebar_collapsed') === 'true') {
                document.documentElement.classList.add('sidebar-collapsed-init');
            }
        })();
    </script>
</head>
<body>
    <script>
        // Apply sidebar-collapsed class to body immediately
        if (localStorage.getItem('sidebar_collapsed') === 'true') {
            document.body.classList.add('sidebar-collapsed');
        }
    </script>
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="logo-container">
            <div class="logo-icon">
                <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                </svg>
            </div>
            <span class="logo-text">QA Platform</span>
        </div>
        <button id="sidebar-collapse-btn" class="icon-btn" title="Collapse sidebar" style="padding:6px;">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/>
            </svg>
        </button>
    </div>
    <nav class="sidebar-nav">
        <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}"><svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg> Dashboard</a>
        <a href="/tests" class="nav-link {% if request.path.startswith('/tests') %}active{% endif %}"><svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg> Tests</a>
        <a href="/runs" class="nav-link {% if request.path.startswith('/runs') %}active{% endif %}"><svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> Runs</a>
        <a href="/ai/studio" class="nav-link {% if request.path.startswith('/ai') %}active{% endif %}"><svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg> AI Studio</a>
        <a href="/settings" class="nav-link {% if request.path.startswith('/settings') %}active{% endif %}"><svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg> Settings</a>
    </nav>
    <div class="sidebar-footer">
        <div class="theme-toggle-container">
            <span class="theme-label">Theme</span>
            <button id="theme-toggle-btn" class="icon-btn" title="Toggle light/dark mode"><span id="theme-icon">🌙</span></button>
        </div>
        <div class="status-indicator">
            <span class="dot bg-gray" id="rec-status-dot"></span>
            <span class="status-text" id="rec-status-text">Idle</span>
        </div>
    </div>
</aside>

    <!-- ─── Main Content ─────────────────────────────────────────────── -->
    <main class="main-content">
        <div class="breadcrumb">
            {% block breadcrumb %}{% endblock %}
        </div>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Toast container -->
    <div id="toast-container"></div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox hidden">
        <div class="lightbox-content">
            <img id="lightbox-img" src="" alt="Screenshot">
            <div class="lightbox-controls">
                <button id="lightbox-prev" class="btn btn-secondary">← Prev</button>
                <button id="lightbox-next" class="btn btn-secondary">Next →</button>
                <button id="lightbox-close" class="btn btn-ghost">✕ Close</button>
            </div>
        </div>
    </div>

    <!-- Command Palette (Ctrl+K) -->
    <div id="command-palette" class="modal hidden">
        <div class="modal-content" style="padding:16px; max-width:580px;">
            <input type="text" id="cmd-input" class="input w-full" placeholder="Search commands… (e.g. 'Go to Tests')" style="font-size:15px; padding:14px 18px; margin-bottom:12px;">
            <div id="cmd-results"></div>
            <div style="font-size:11px; color:var(--text-tertiary); text-align:center; margin-top:12px; letter-spacing:0.04em;">
                Press <kbd style="font-family:var(--font-mono); font-size:10px; padding:2px 6px; background:var(--bg-elevated); border:1px solid var(--border-strong); border-radius:4px;">Esc</kbd> to close &nbsp;·&nbsp;
                <kbd style="font-family:var(--font-mono); font-size:10px; padding:2px 6px; background:var(--bg-elevated); border:1px solid var(--border-strong); border-radius:4px;">Ctrl K</kbd> to toggle
            </div>
        </div>
    </div>

    <script>
        // ─── Collapsible Sidebar ────────────────────────────────────────
        const collapseBtn = document.getElementById('sidebar-collapse-btn');
        if (collapseBtn) {
            collapseBtn.addEventListener('click', () => {
                document.body.classList.toggle('sidebar-collapsed');
                const collapsed = document.body.classList.contains('sidebar-collapsed');
                localStorage.setItem('sidebar_collapsed', collapsed ? 'true' : 'false');
                collapseBtn.querySelector('svg').style.transform = collapsed ? 'rotate(180deg)' : '';
            });
            // Restore icon rotation state
            if (localStorage.getItem('sidebar_collapsed') === 'true') {
                const svg = collapseBtn.querySelector('svg');
                if (svg) svg.style.transform = 'rotate(180deg)';
            }
        }

        // ─── Theme Toggle ───────────────────────────────────────────────
        const themeToggleBtn = document.getElementById('theme-toggle-btn');
        const themeIcon      = document.getElementById('theme-icon');

        function getTheme() {
            return localStorage.getItem('theme') || 'dark';
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            if (themeIcon) {
                themeIcon.textContent = theme === 'light' ? '☀️' : '🌙';
            }
        }

        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', () => {
                applyTheme(getTheme() === 'light' ? 'dark' : 'light');
            });
        }

        // Apply on load (icon sync)
        applyTheme(getTheme());
    </script>
</body>
</html>
